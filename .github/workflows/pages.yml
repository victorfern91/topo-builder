name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Shares a group with the pull request preview workflow so the two
# publishes cannot overwrite each other on gh-pages.
concurrency:
  group: gh-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: docker://oven/bun:1.4.0
        with:
          args: install --frozen-lockfile

      - name: Build
        uses: docker://oven/bun:1.4.0
        with:
          args: run build
        env:
          # Project site for victorfern91/topo-builder. A user site or a
          # renamed repository needs a different base path.
          VITE_BASE_PATH: /topo-builder/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          # Pull request previews live under this directory.
          clean-exclude: pr-preview/**
          force: false
