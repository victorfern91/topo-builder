name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# Shares a group with the pull request preview workflow so the two
# publishes cannot overwrite each other on gh-pages.
concurrency:
  group: gh-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site
        id: site
        uses: ./.github/actions/build-site
        with:
          base-path: /topo-builder/
          force: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Deploy to GitHub Pages
        if: success() && steps.site.outputs.built == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          # Pull request previews live under this directory.
          clean-exclude: pr-preview/**
          force: false
