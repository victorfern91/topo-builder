name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The version commit uses the deploy key configured below.
          persist-credentials: false

      - name: Install dependencies
        uses: docker://oven/bun:1.4.4
        with:
          args: bun install --frozen-lockfile

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # main requires a pull request. This key is the bypass actor for the
      # version commit; GITHUB_TOKEN still opens the GitHub release.
      - name: Configure the release key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > ~/.ssh/release_deploy_key
          chmod 600 ~/.ssh/release_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git remote set-url origin git@github.com:victorfern91/topo-builder.git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "GIT_SSH_COMMAND<<EOF"
            echo "ssh -i $HOME/.ssh/release_deploy_key -o IdentitiesOnly=yes"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./node_modules/semantic-release/bin/semantic-release.js
