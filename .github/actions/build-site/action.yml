name: Build site
description: Install, reuse cached dependencies, and build when this change touches the app.

inputs:
  base-path:
    description: Vite base path
    required: true
  force:
    description: Build even when the app is unchanged
    required: false
    default: "false"

outputs:
  built:
    description: True when dist was built
    value: ${{ inputs.force == 'true' || steps.changes.outputs.app == 'true' }}

runs:
  using: composite
  steps:
    - name: Detect app changes
      id: changes
      if: inputs.force != 'true'
      uses: dorny/paths-filter@v4
      with:
        # A later push on a pull request is compared with the previous head.
        # The default token always compares a pull request with its base.
        token: ${{ github.event.action != 'synchronize' && github.token || '' }}
        base: ${{ github.event.action == 'synchronize' && github.event.before || github.event.repository.default_branch }}
        filters: |
          app:
            - 'src/**'
            - 'packages/**'
            - 'public/**'
            - 'index.html'
            - 'package.json'
            - 'bun.lock'
            - 'vite.config.ts'
            - 'tsconfig*.json'

    - name: Cache node_modules
      if: success() && (inputs.force == 'true' || steps.changes.outputs.app == 'true')
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          packages/ui/components/node_modules
        key: node-modules-${{ runner.os }}-bun-1.4.4-${{ hashFiles('bun.lock') }}
        restore-keys: |
          node-modules-${{ runner.os }}-bun-1.4.4-

    - name: Install dependencies
      if: success() && (inputs.force == 'true' || steps.changes.outputs.app == 'true')
      uses: docker://oven/bun:1.4.4
      with:
        args: bun install --frozen-lockfile

    - name: Build
      if: success() && (inputs.force == 'true' || steps.changes.outputs.app == 'true')
      uses: docker://oven/bun:1.4.4
      with:
        args: bun run build
      env:
        VITE_BASE_PATH: ${{ inputs.base-path }}
