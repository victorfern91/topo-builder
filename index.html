<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#323232" />
    <title>Topo</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #1e1e1e;
      }
      .boot {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: #1e1e1e;
      }
      .boot-bar {
        height: 42px;
        background: #323232;
        border-bottom: 1px solid #1a1a1a;
      }
      .boot-stage {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 28px 20px;
      }
      .boot-board {
        width: min(560px, 100%);
        min-height: 280px;
        padding: 28px;
        background: #fff;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.4),
          0 16px 40px rgba(0, 0, 0, 0.35);
      }
      .boot-line,
      .boot-block {
        background: linear-gradient(
          90deg,
          #e6e6e6 0%,
          #f4f4f4 50%,
          #e6e6e6 100%
        );
        background-size: 200% 100%;
        animation: boot-shimmer 1.2s ease-in-out infinite;
      }
      .boot-line {
        width: 42%;
        height: 12px;
        margin-bottom: 18px;
      }
      .boot-block {
        width: 100%;
        height: 180px;
      }
      @keyframes boot-shimmer {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: -100% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-line,
        .boot-block {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true" aria-label="Loading Topo">
        <div class="boot-bar"></div>
        <div class="boot-stage">
          <div class="boot-board">
            <div class="boot-line"></div>
            <div class="boot-block"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var tags =
          navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || "en-US"];
        var locale = "en-US";
        for (var i = 0; i < tags.length; i++) {
          var language = "";
          try {
            language = new Intl.Locale(tags[i]).language;
          } catch {
            continue;
          }
          if (language === "pt") {
            locale = "pt-PT";
            break;
          }
          if (language === "en") {
            locale = "en-US";
            break;
          }
        }
        document.documentElement.lang = locale;
        var boot = document.querySelector(".boot");
        if (boot) {
          boot.setAttribute(
            "aria-label",
            locale === "pt-PT" ? "A carregar o Topo" : "Loading Topo",
          );
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
