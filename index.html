<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/topo-builder/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#323232" />
    <title>Topo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@700&display=swap"
    />
    <style>html,body{background:#1e1e1e;height:100%;margin:0}.boot{background:#1e1e1e;flex-direction:column;height:100%;display:flex}.boot-bar{background:#323232;border-bottom:1px solid #1a1a1a;height:42px}.boot-stage{flex:1;place-items:center;padding:28px 20px;display:grid}.boot-board{background:#fff;width:min(560px,100%);min-height:280px;padding:28px;box-shadow:0 0 0 1px #0006,0 16px 40px #00000059}.boot-line,.boot-block{background:linear-gradient(90deg,#e6e6e6 0%,#f4f4f4 50%,#e6e6e6 100%) 0 0/200% 100%;animation:1.2s ease-in-out infinite boot-shimmer}.boot-line{width:42%;height:12px;margin-bottom:18px}.boot-block{width:100%;height:180px}@keyframes boot-shimmer{0%{background-position:100% 0}to{background-position:-100% 0}}@media (prefers-reduced-motion:reduce){.boot-line,.boot-block{animation:none}}</style>
    <script type="module" crossorigin src="/topo-builder/assets/index-DAJ-Zyuw.js"></script>
    <link rel="modulepreload" crossorigin href="/topo-builder/assets/rolldown-runtime-pP25SEvz.js">
    <link rel="stylesheet" crossorigin href="/topo-builder/assets/index-tsyVpHy-.css">
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true" aria-label="Loading Topo">
        <div class="boot-bar"></div>
        <div class="boot-stage">
          <div class="boot-board">
            <div class="boot-line"></div>
            <div class="boot-block"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var tags =
          navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || "en-US"];
        var locale = "en-US";
        for (var i = 0; i < tags.length; i++) {
          var language = "";
          try {
            language = new Intl.Locale(tags[i]).language;
          } catch {
            continue;
          }
          if (language === "pt") {
            locale = "pt-PT";
            break;
          }
          if (language === "en") {
            locale = "en-US";
            break;
          }
        }
        document.documentElement.lang = locale;
        var boot = document.querySelector(".boot");
        if (boot) {
          boot.setAttribute(
            "aria-label",
            locale === "pt-PT" ? "A carregar o Topo" : "Loading Topo",
          );
        }
      })();
    </script>
  </body>
</html>
